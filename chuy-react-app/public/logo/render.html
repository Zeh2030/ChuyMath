<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;overflow:hidden;background:transparent}
  img{display:block}
</style></head><body>
<img id="i" src="chuymath.svg">
<script>
  const px = new URLSearchParams(location.search).get('px') || 512;
  const i = document.getElementById('i');
  i.width = px; i.height = px;
  document.documentElement.style.width = px + 'px';
  document.documentElement.style.height = px + 'px';
</script>
</body></html>
