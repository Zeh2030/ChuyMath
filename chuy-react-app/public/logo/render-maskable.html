<!doctype html><html><head><meta charset="utf-8"><style>
  /* Android recorta el icono con su propia forma. Un icono "maskable" debe
     tener el contenido dentro del 80% central y el fondo a sangre completa,
     o el cohete sale mochado. */
  html,body{margin:0;padding:0;overflow:hidden;background:#232c66}
  body{display:flex;align-items:center;justify-content:center}
  img{display:block}
</style></head><body>
<img id="i" src="chuymath.svg">
<script>
  const px = +(new URLSearchParams(location.search).get('px') || 512);
  const i = document.getElementById('i');
  const dentro = Math.round(px * 0.7); // margen de seguridad
  i.width = dentro; i.height = dentro;
  document.documentElement.style.width = px + 'px';
  document.documentElement.style.height = px + 'px';
  document.body.style.width = px + 'px';
  document.body.style.height = px + 'px';
</script>
</body></html>
