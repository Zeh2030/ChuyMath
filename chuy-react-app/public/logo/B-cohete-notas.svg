<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cohete con estela de notas">
  <rect width="64" height="64" rx="14" fill="#232c66"/>
  <circle cx="13" cy="12" r="1.3" fill="#ffffff" opacity=".55"/>
  <circle cx="52" cy="16" r="1" fill="#ffffff" opacity=".4"/>

  <!-- Estela de notas: al hacerse chiquito degrada a puntitos de escape -->
  <g fill="#ffd447">
    <ellipse cx="26" cy="53.5" rx="3.1" ry="2.4" transform="rotate(-20 26 53.5)"/>
    <rect x="28.4" y="45.5" width="1.5" height="7.5" rx=".7"/>
    <path d="M29.9 45.5 q4 1.2 2.6 4.6 q-.4-2.6-2.6-2.9 Z"/>
  </g>
  <g fill="#7fd4a8">
    <ellipse cx="39" cy="56.5" rx="2.4" ry="1.9" transform="rotate(-20 39 56.5)"/>
    <rect x="40.9" y="50.5" width="1.2" height="5.8" rx=".6"/>
  </g>
  <circle cx="33" cy="49" r="1.3" fill="#ffffff" opacity=".7"/>

  <!-- Aletas -->
  <path d="M26 35 L19.5 45.5 L26 43 Z" fill="#e6503c"/>
  <path d="M38 35 L44.5 45.5 L38 43 Z" fill="#e6503c"/>

  <!-- Cuerpo -->
  <rect x="26" y="19.5" width="12" height="24" rx="2" fill="#f4f7fb"/>
  <rect x="26" y="19.5" width="3.5" height="24" rx="2" fill="#c9d6e6" opacity=".7"/>

  <!-- Nariz -->
  <path d="M32 6 L26 19.5 L38 19.5 Z" fill="#e6503c"/>

  <!-- Ventanilla -->
  <circle cx="32" cy="28" r="3.6" fill="#8fdcf7"/>
  <circle cx="32" cy="28" r="3.6" fill="none" stroke="#2b3a7a" stroke-width="1.3"/>
</svg>
