<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Contorno de la bandera de México para colorear (proporción oficial 4:7).
       Tres franjas verticales y el lugar del escudo al centro. Dibujo propio. -->
  <rect width="800" height="800" fill="#ffffff"/>
  <g fill="#ffffff" stroke="#2b2b2b" stroke-width="10" stroke-linejoin="round">
    <rect x="50" y="200" width="700" height="400" rx="6"/>
    <line x1="283" y1="200" x2="283" y2="600"/>
    <line x1="517" y1="200" x2="517" y2="600"/>
  </g>
  <!-- Lugar del escudo: el nopal sobre la piedra; el águila la dibuja el niño -->
  <g fill="#ffffff" stroke="#2b2b2b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="400" cy="400" rx="92" ry="98" stroke-dasharray="14 10"/>
    <path d="M356 474 Q400 492 444 474"/>
    <ellipse cx="400" cy="450" rx="18" ry="24"/>
    <ellipse cx="376" cy="426" rx="13" ry="18" transform="rotate(-25,376,426)"/>
    <ellipse cx="424" cy="426" rx="13" ry="18" transform="rotate(25,424,426)"/>
  </g>
</svg>
