<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- Renglon: linea superior, media (punteada) y base -->
  <g stroke="#dfe6e9" stroke-width="4" fill="none">
    <path d="M 60 200 H 760"/>
    <path d="M 60 600 H 760"/>
  </g>
  <g stroke="#dfe6e9" stroke-width="3" stroke-dasharray="10 14" fill="none">
    <path d="M 60 400 H 760"/>
  </g>
  <!-- Letra punteada: I mayuscula (1 trazo) + i minuscula (palito y puntito) -->
  <g fill="none" stroke="#5a9bd5" stroke-width="14" stroke-dasharray="20 26" stroke-linecap="round">
    <path d="M 220 200 L 220 600"/>
    <path d="M 600 400 L 600 600"/>
  </g>
  <!-- El puntito de la i: una marca solida para tapar, no un trazo que seguir -->
  <circle cx="600" cy="312" r="24" fill="#5a9bd5" opacity="0.35"/>
  <!-- Flechas de direccion -->
  <g fill="#5a9bd5">
    <polygon points="-16,-15 -16,15 16,0" transform="translate(220,400) rotate(90)"/>
    <polygon points="-16,-15 -16,15 16,0" transform="translate(600,500) rotate(90)"/>
  </g>
  <!-- Fin de cada trazo -->
  <g fill="#e74c3c">
    <circle cx="220" cy="600" r="16"/>
    <circle cx="600" cy="600" r="16"/>
  </g>
  <!-- Inicio de cada trazo (se pinta al final para que quede encima) -->
  <g fill="#2ecc71">
    <circle cx="220" cy="200" r="16"/>
    <circle cx="600" cy="400" r="16"/>
  </g>
</svg>
