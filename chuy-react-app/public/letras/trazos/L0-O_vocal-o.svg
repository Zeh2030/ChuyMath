<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- Renglon: linea superior, media (punteada) y base -->
  <g stroke="#dfe6e9" stroke-width="4" fill="none">
    <path d="M 60 200 H 760"/>
    <path d="M 60 600 H 760"/>
  </g>
  <g stroke="#dfe6e9" stroke-width="3" stroke-dasharray="10 14" fill="none">
    <path d="M 60 400 H 760"/>
  </g>
  <!-- Letra punteada: O mayuscula + o minuscula (ambas de una sola vuelta, hacia la izquierda) -->
  <g fill="none" stroke="#5a9bd5" stroke-width="14" stroke-dasharray="20 26" stroke-linecap="round">
    <path d="M 220 200 A 110 200 0 1 0 220 600 A 110 200 0 1 0 220 200"/>
    <path d="M 600 400 A 100 100 0 1 0 600 600 A 100 100 0 1 0 600 400"/>
  </g>
  <!-- Flechas de direccion (la vuelta empieza arriba y va hacia la izquierda) -->
  <g fill="#5a9bd5">
    <polygon points="-16,-15 -16,15 16,0" transform="translate(180,207) rotate(190)"/>
    <polygon points="-16,-15 -16,15 16,0" transform="translate(562,407) rotate(190)"/>
  </g>
  <!-- Inicio de cada trazo -->
  <g fill="#2ecc71">
    <circle cx="220" cy="200" r="16"/>
    <circle cx="600" cy="400" r="16"/>
  </g>
</svg>
