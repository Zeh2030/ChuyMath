<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- Renglon: linea superior, media (punteada) y base -->
  <g stroke="#dfe6e9" stroke-width="4" fill="none">
    <path d="M 60 200 H 760"/>
    <path d="M 60 600 H 760"/>
  </g>
  <g stroke="#dfe6e9" stroke-width="3" stroke-dasharray="10 14" fill="none">
    <path d="M 60 400 H 760"/>
  </g>
  <!-- Letra punteada: U mayuscula (baja, curva y sube) + u minuscula (curva + palito) -->
  <g fill="none" stroke="#5a9bd5" stroke-width="14" stroke-dasharray="20 26" stroke-linecap="round">
    <path d="M 120 200 L 120 490 A 100 110 0 0 0 320 490 L 320 200"/>
    <path d="M 510 400 L 510 530 A 90 70 0 0 0 690 530"/>
    <path d="M 690 400 L 690 600"/>
  </g>
  <!-- Flechas de direccion -->
  <g fill="#5a9bd5">
    <polygon points="-16,-15 -16,15 16,0" transform="translate(120,340) rotate(90)"/>
    <polygon points="-16,-15 -16,15 16,0" transform="translate(320,340) rotate(270)"/>
    <polygon points="-16,-15 -16,15 16,0" transform="translate(510,470) rotate(90)"/>
    <polygon points="-16,-15 -16,15 16,0" transform="translate(690,500) rotate(90)"/>
  </g>
  <!-- Fin de cada trazo -->
  <g fill="#e74c3c">
    <circle cx="320" cy="200" r="16"/>
    <circle cx="690" cy="600" r="16"/>
  </g>
  <!-- Inicio de cada trazo (se pinta al final para que quede encima) -->
  <g fill="#2ecc71">
    <circle cx="120" cy="200" r="16"/>
    <circle cx="510" cy="400" r="16"/>
    <circle cx="690" cy="400" r="16"/>
  </g>
</svg>
