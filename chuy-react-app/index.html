<!doctype html>
<!-- lang="es": la app esta en espanol. Con lang="en" (el default de Vite) Chrome la
     tomaba por inglesa y la auto-traducia, rompiendo las letras sueltas del modulo de
     Letras: la "U" salia como "tu" (U = you) y la "E" como "mi". -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg es la version de acercamiento: a 16px el logo completo se
         lee como una manchita, porque el cohete es delgado y queda mucho fondo -->
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <!-- PNG de respaldo: navegadores viejos ignoran el favicon en SVG -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/icon-32.png" />
    <!-- iOS no lee el manifest para el icono de pantalla de inicio: usa este -->
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#232c66" />
    <meta name="apple-mobile-web-app-title" content="ChuyMath" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChuyMath</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
