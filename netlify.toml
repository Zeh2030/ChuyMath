[build]
  base = "chuy-react-app"
  publish = "dist"
  command = "npm run build"
  # NO volver a poner un comando `ignore` aqui sin probarlo antes en una rama.
  #
  # Historia (2026-08-09): se agrego un `ignore` con git diff para "ahorrar
  # minutos de build" y el resultado fue que TODOS los deploys se cancelaron
  # durante un mes -- en Netlify, exit 0 del `ignore` significa cancelar, y el
  # comando devolvia 0 siempre. El sintoma en el log es "Building: Complete"
  # seguido de "Deploying: Skipped".
  #
  # CORRECCION (2026-08-12): este comentario decia ademas que "el consumo real
  # es 0,1 creditos y las implementaciones de produccion aparecen como 0". Eso
  # ya NO es cierto y conviene no fiarse de ello. Los deploys SI son el gasto
  # dominante (ancho de banda y peticiones son ruido).
  #
  # CORRECCION (2026-08-13): habia DOS proyectos de Netlify colgados de este
  # mismo repo -- `chuymaths` (el que se usa) y `chuymath` (abandonado). Cada
  # push construia LOS DOS, asi que todo costaba el doble. Medido en el panel:
  #
  #     225,5 creditos / 12 pushes x 2 sitios = ~10 creditos por deploy
  #     300 creditos gratis al mes            = ~30 deploys, o ~15 pushes
  #                                             mientras existan los 2 sitios
  #
  # Antes de dar por buena una cuenta de creditos, revisar cuantos proyectos
  # despliegan desde el repo (panel de Netlify), no solo cuantos pushes se han
  # hecho. Aun asi conviene agrupar varios commits en un solo push.
  #
  # Lo que de verdad ahorra sin tocar esta config: el contenido de las materias
  # NO forma parte del build. Los JSON de _contenido/, _content/, _geografia/,
  # etc. viven en Firestore y se suben desde /admin/migracion, asi que anadir o
  # corregir contenido no necesita desplegar nada. Solo los cambios en
  # chuy-react-app/ requieren un deploy.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

