[build]
  base = "chuy-react-app"
  publish = "dist"
  command = "npm run build"
  # NO volver a poner un comando `ignore` aqui sin una razon medida.
  #
  # Historia (2026-08-09): se agrego un `ignore` con git diff para "ahorrar
  # minutos de build" y el resultado fue que TODOS los deploys se cancelaron
  # durante un mes -- en Netlify, exit 0 del `ignore` significa cancelar, y el
  # comando devolvia 0 siempre. El sintoma en el log es "Building: Complete"
  # seguido de "Deploying: Skipped".
  #
  # Y el ahorro que buscaba no existia: en el plan gratuito hay 300 creditos/mes
  # y el consumo real del sitio es 0,1 (las "Implementaciones de produccion"
  # aparecen como 0 creditos). Era una optimizacion prematura que costo un mes
  # de trabajo sin desplegar. Si algun dia los creditos SI aprietan, medir
  # primero y probar el comando en un deploy de rama antes de meterlo a produccion.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

